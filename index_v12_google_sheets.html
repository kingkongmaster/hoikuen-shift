function yearMonth(){return `${curYear}-${String(curMonth+1).padStart(2,'0')}`}function ds(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}function isSummerHoliday(date){const[,mm,dd]=date.split('-').map(Number);return mm===8&&dd>=12&&dd<=15}function isClosedDay(date,dow){return dow===0||isSummerHoliday(date)}function closedLabel(date,dow){if(isSummerHoliday(date))return'夏';if(dow===0)return'日';return'－'}function staffById(id){return staffList.find(s=>s.staffId===id)}function getShift(date,sid){return(shifts[date]||{})[sid]||null}function isWorking(sh){return['E','N','L'].includes(sh)}function canWorkDow(s,dow){if(dow===6&&!s.canSaturday)return false;if(dow===6&&s.isPartTime)return false;const map={月:1,火:2,水:3,木:4,金:5,土:6};return String(s.workDays||'').split('・').map(x=>map[x]).includes(dow)}function canDoShift(s,sh){if(sh==='E')return s.canEarly;if(sh==='L')return s.canLate;if(sh==='N')return s.canNormal;return false}function isEarlyLate(sh){return sh==='E'||sh==='L'}
function enableAdminMode(){const p=document.getElementById('admin-pass').value;if(!p){alert('管理人パスワードを入力してください');return}adminPassword=p;isAdmin=true;document.body.classList.add('admin-mode');document.getElementById('mode-label').textContent='管理人モード';renderShift();renderStaff();alert('管理人モードにしました。保存時にGAS側でもパスワード確認されます。')}
function disableAdminMode(){isAdmin=false;adminPassword='';document.getElementById('admin-pass').value='';document.body.classList.remove('admin-mode');document.getElementById('mode-label').textContent='閲覧専用';renderShift()}
function showTab(t){['shift','staff','request','settings'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hidden',x!==t));document.querySelectorAll('.tab').forEach((el,i)=>{const tabs=['shift','staff','request','settings'];el.classList.toggle('active',tabs[i]===t)});if(t==='shift')renderShift();if(t==='staff')renderStaff();if(t==='request')renderRequests()}
async function init(){document.getElementById('gas-url-label').textContent=GAS_URL;try{const r=await jsonp('loadStaff');if(r&&r.ok&&Array.isArray(r.staff)&&r.staff.length){staffList=r.staff.map(normalizeStaff)}else{staffList=FALLBACK_STAFF.map(normalizeStaff)}}catch(e){staffList=FALLBACK_STAFF.map(normalizeStaff)}populateSelects();await loadMonthData();renderStaff()}window.addEventListener('DOMContentLoaded',init)
async function loadMonthData(){try{const r=await jsonp('loadShift',{yearMonth:yearMonth()});if(r&&r.ok&&r.shift){shifts=r.shift.shifts||r.shift;requests=r.shift.requests||[]}else{shifts={};requests=[]}}catch(e){console.warn(e);shifts={};requests=[]}renderShift();renderRequests()}
function prevMonth(){curMonth--;if(curMonth<0){curMonth=11;curYear--}loadMonthData()}function nextMonth(){curMonth++;if(curMonth>11){curMonth=0;curYear++}loadMonthData()}
function populateSelects(){const rs=document.getElementById('req-staff');rs.innerHTML=staffList.map(s=>`<option value="${s.staffId}">${s.name}</option>`).join('')}
function autoAssign(){if(!isAdmin)return;const y=curYear,m=curMonth,days=daysInMonth(y,m);shifts={};const counts={};staffList.forEach(s=>counts[s.staffId]={hours:0,early:0,late:0,normal:0,sat:0});const full=staffList.filter(s=>!s.isPartTime);const parts=staffList.filter(s=>s.isPartTime);const reqMap={};requests.forEach(r=>{reqMap[r.date+'_'+r.staffId]=r.type});function pick(pool,sh,date,dow,used){const d=Number(date.split('-')[2]);return pool.filter(s=>!used.has(s.staffId)&&canDoShift(s,sh)&&canWorkDow(s,dow)&&!reqMap[date+'_'+s.staffId]&&!isEarlyLate(getShift(ds(y,m,d-1),s.staffId))||false).sort((a,b)=>(counts[a.staffId].hours+counts[a.staffId][sh==='E'?'early':sh==='L'?'late':'normal']*4)-(counts[b.staffId].hours+counts[b.staffId][sh==='E'?'early':sh==='L'?'late':'normal']*4))[0]}function set(date,s,sh,dow){shifts[date][s.staffId]=sh;counts[s.staffId].hours+=8;if(sh==='E')counts[s.staffId].early++;if(sh==='L')counts[s.staffId].late++;if(sh==='N')counts[s.staffId].normal++;if(dow===6)counts[s.staffId].sat++}
for(let d=1;d<=days;d++){const date=ds(y,m,d),dow=new Date(y,m,d).getDay();shifts[date]={};staffList.forEach(s=>shifts[date][s.staffId]='H');if(isClosedDay(date,dow))continue;const used=new Set();if(dow>=1&&dow<=5){full.forEach(s=>{if(reqMap[date+'_'+s.staffId])shifts[date][s.staffId]=reqMap[date+'_'+s.staffId];else if(canWorkDow(s,dow)&&canDoShift(s,'N')){set(date,s,'N',dow);used.add(s.staffId)}});for(const sh of ['E','E','L','L']){let cand=full.filter(s=>used.has(s.staffId)&&canDoShift(s,sh)&&!isEarlyLate(getShift(ds(y,m,d-1),s.staffId))).sort((a,b)=>counts[a.staffId][sh==='E'?'early':'late']-counts[b.staffId][sh==='E'?'early':'late'])[0];if(cand){counts[cand.staffId].hours-=8;counts[cand.staffId].normal--;shifts[date][cand.staffId]=sh;counts[cand.staffId].hours+=8;if(sh==='E')counts[cand.staffId].early++;else counts[cand.staffId].late++}}for(const sh of ['E','L','N','N']){const p=pick(parts,sh,date,dow,used);if(p&&counts[p.staffId].hours<p.monthlyHours){set(date,p,sh,dow);used.add(p.staffId)}}}else if(dow===6){const available=full.filter(s=>canWorkDow(s,dow)&&!reqMap[date+'_'+s.staffId]).sort((a,b)=>counts[a.staffId].sat-counts[b.staffId].sat);available.slice(0,Math.ceil(available.length/2)).forEach((s,i)=>set(date,s,i<2&&s.canEarly?'E':i<4&&s.canLate?'L':'N',dow))}}
renderShift();alert('自動生成しました。内容を確認してから保存してください。')}
async function saveCurrentShift(){if(!isAdmin){alert('閲覧専用では保存できません');return}await postGas({action:'saveShift',adminPassword,yearMonth:yearMonth(),shift:{shifts,requests,savedAt:new Date().toISOString()}});alert('保存リクエストを送信しました。読込ボタンで確認してください。')}
function renderShift(){const y=curYear,m=curMonth,days=daysInMonth(y,m);document.getElementById('month-label').textContent=`${y}年${m+1}月`;const filter=document.getElementById('cls-filter').value;let disp=filter==='all'?staffList:staffList.filter(s=>s.className===filter);let totalE=0,totalN=0,totalL=0,totalO=0;for(let d=1;d<=days;d++){const date=ds(y,m,d);disp.forEach(s=>{const sh=getShift(date,s.staffId);if(sh==='E')totalE++;if(sh==='N')totalN++;if(sh==='L')totalL++;if(sh==='O'||sh==='P')totalO++})}document.getElementById('shift-stats').innerHTML=`<div class="stat"><div class="stat-n">${totalN}</div><div class="stat-l">通常</div></div><div class="stat"><div class="stat-n">${totalE}</div><div class="stat-l">早出</div></div><div class="stat"><div class="stat-n">${totalL}</div><div class="stat-l">遅出</div></div><div class="stat"><div class="stat-n">${totalO}</div><div class="stat-l">休暇</div></div><div class="stat"><div class="stat-n">${disp.length}</div><div class="stat-l">人数</div></div>`;let warn=[];disp.forEach(s=>{for(let d=2;d<=days;d++){const a=getShift(ds(y,m,d-1),s.staffId),b=getShift(ds(y,m,d),s.staffId);if(isEarlyLate(a)&&isEarlyLate(b)){warn.push(`${s.name} 早/遅連続 ${m+1}/${d-1}-${d}`);break}}});document.getElementById('shift-alerts').innerHTML=warn.length?`<div class="alert alert-warn">⚠️ ${warn.slice(0,6).join('　')}</div>`:`<div class="alert alert-ok">✅ 表示中のシフトを確認できます。</div>`;let html='<thead><tr><th class="sname">氏名</th><th class="scls">クラス</th>';for(let d=1;d<=days;d++){const date=ds(y,m,d),dow=new Date(y,m,d).getDay(),cls=isClosedDay(date,dow)?'sun':dow===6?'sat':'';html+=`<th class="${cls}">${d}<br><span style="font-size:9px">${isClosedDay(date,dow)?closedLabel(date,dow):DOW[dow]}</span></th>`}html+='<th>通</th><th>早</th><th>遅</th><th>休</th><th>時間</th></tr></thead><tbody>';disp.forEach(s=>{html+=`<tr><td class="sname">${s.name}${s.isPartTime?'<span class="badge b-part" style="font-size:9px">P</span>':s.role==='再雇用'?'<span class="badge b-reemp" style="font-size:9px">再</span>':''}</td><td class="scls"><span class="badge b-cls">${s.className}</span></td>`;let nc=0,ec=0,lc=0,oc=0,hc=0;for(let d=1;d<=days;d++){const date=ds(y,m,d),dow=new Date(y,m,d).getDay(),isH=isClosedDay(date,dow),cellCls=isH?'sun':dow===6?'sat':'';let sh=getShift(date,s.staffId),inner='<span style="font-size:9px;color:#ccc">―</span>';if(sh==='E'){inner='<span class="sc se">早</span>';ec++;hc+=8}else if(sh==='N'){inner='<span class="sc sn">通</span>';nc++;hc+=8}else if(sh==='L'){inner='<span class="sc sl">遅</span>';lc++;hc+=8}else if(sh==='O'){inner='<span class="sc so">休</span>';oc++}else if(sh==='P'){inner='<span class="sc sp">有</span>';oc++}else if(sh==='H'){const lab=closedLabel(date,dow);inner=`<span class="sc ${lab==='夏'?'sv':'sh'}">${lab==='日'?'－':lab}</span>`}html+=`<td class="${cellCls} ${isAdmin&&!isH?'editable':''}" ${isAdmin&&!isH?`onclick="cycleShift('${date}','${s.staffId}')"`:''}>${inner}</td>`}html+=`<td>${nc}</td><td>${ec}</td><td>${lc}</td><td>${oc}</td><td>${hc}/${s.monthlyHours}</td></tr>`});html+='</tbody>';document.getElementById('shift-table').innerHTML=html}
function cycleShift(date,staffId){if(!isAdmin)return;const s=staffById(staffId);if(!shifts[date])shifts[date]={};const cur=getShift(date,staffId)||'H';const seq=[];if(s.canNormal)seq.push('N');if(s.canEarly)seq.push('E');if(s.canLate)seq.push('L');seq.push('O','P','H');shifts[date][staffId]=seq[(seq.indexOf(cur)+1)%seq.length];renderShift()}
function renderStaff(){let html='';['0歳児','1歳児','2歳児','3歳児','4歳児','5歳児','フリー・管理'].forEach(cls=>{const members=staffList.filter(s=>s.className===cls);if(!members.length)return;html+=`<div class="card"><div class="card-title">${cls}クラス</div>`;members.forEach(s=>{html+=`<div class="staff-item"><span style="font-weight:500;min-width:90px">${s.name}</span><span class="badge ${s.isPartTime?'b-part':s.role==='再雇用'?'b-reemp':'b-full'}">${s.role}</span><span class="badge ${s.qualification==='保育士'?'b-cls':'b-hol'}">${s.qualification}</span><span class="badge b-hol">${s.position}</span><span class="badge b-early">${s.workPattern}</span><span class="badge b-hol">月${s.monthlyHours}h</span><span class="badge ${s.canSaturday?'b-part':'b-off'}">土曜${s.canSaturday?'可':'不可'}・連続${s.maxConsecutiveSaturday}週まで</span><span class="badge b-hol">曜日:${s.workDays}</span></div>`});html+='</div>'});document.getElementById('staff-list').innerHTML=html}
function addRequest(){const staffId=document.getElementById('req-staff').value,date=document.getElementById('req-date').value,type=document.getElementById('req-type').value,note=document.getElementById('req-note').value;if(!date){alert('日付を選択してください');return}requests.push({staffId,date,type,note});if(!shifts[date])shifts[date]={};shifts[date][staffId]=type;renderRequests();renderShift()}
function renderRequests(){let html='';requests.forEach((r,i)=>{const s=staffById(r.staffId);html+=`<div class="card"><strong>${s?s.name:r.staffId}</strong> ${r.date} ${r.type==='P'?'有給':'希望休'} ${r.note||''} <button class="btn btn-sm btn-red admin-only" onclick="requests.splice(${i},1);renderRequests();renderShift()">削除</button></div>`});document.getElementById('request-list').innerHTML=html||'<div class="alert alert-info">希望休の登録はありません。</div>'}
function exportExcel(){const y=curYear,m=curMonth,days=daysInMonth(y,m),rows=[];const header=['氏名','クラス','種別'];for(let d=1;d<=days;d++)header.push(`${d}日`);header.push('時間/契約');rows.push(header);staffList.forEach(s=>{const row=[s.name,s.className,s.role];let hc=0;for(let d=1;d<=days;d++){const sh=getShift(ds(y,m,d),s.staffId)||'';row.push({E:'早',N:'通',L:'遅',O:'休',P:'有',H:'－'}[sh]||'');if(isWorking(sh))hc+=8}row.push(`${hc}/${s.monthlyHours}`);rows.push(row)});const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,`${y}年${m+1}月`);XLSX.writeFile(wb,`シフト表_${y}年${m+1}月.xlsx`)}
</script>
